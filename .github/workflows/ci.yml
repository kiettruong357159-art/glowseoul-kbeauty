name: GlowSeoul CI Quality Gateway

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  quality-gateway:
    name: Code Rules, Types, Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🗄️ Generate Prisma Client
        run: npx prisma generate

      - name: 📋 [Gateway 1/4] Check Architecture & Code Rules
        run: npm run check:rules

      - name: 🔍 [Gateway 2/4] Type Check (tsc --noEmit)
        run: npm run check:types

      - name: 🧪 [Gateway 3/4] Run Automated Unit & Integration Tests
        run: npm test

      - name: 🏗️ [Gateway 4/4] Production Build Check
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
